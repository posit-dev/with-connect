[project]
name = "with-connect"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docker>=7.1.0",
    "rsconnect>=1.29.0",
]

[project.scripts]
# Target cli, not main: the installed command skips the __main__ block, so cli
# gives it the same clean error handling as python main.py.
with-connect = "main:cli"

[tool.setuptools]
py-modules = ["main"]
