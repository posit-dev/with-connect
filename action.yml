name: 'Deploy to Posit Connect'
description: 'Deploy content to Posit Connect using with-connect'
inputs:
  license:
    description: 'Posit Connect license file contents'
    required: true
  version:
    description: 'Posit Connect version to use'
    required: false
    default: 'release'
  config-file:
    description: 'Path to optional rstudio-connect.gcfg configuration file'
    required: false
  image:
    description: 'Container image to use for Posit Connect'
    required: false
  quiet:
    description: 'Suppress progress indicators during image pull'
    required: false
    default: 'false'
  port:
    description: 'Port to map the Connect container to'
    required: false
    default: '3939'
  env:
    description: 'Environment variables to pass to Docker container (one per line, format: KEY=VALUE)'
    required: false
  command:
    description: 'Command to run against Connect (omit to start Connect and output credentials)'
    required: false
  stop:
    description: 'Container ID to stop (use instead of starting a new container)'
    required: false

outputs:
  CONNECT_API_KEY:
    description: 'Connect API key (only set when no command is provided)'
    value: ${{ steps.run.outputs.CONNECT_API_KEY }}
  CONNECT_SERVER:
    description: 'Connect server URL (only set when no command is provided)'
    value: ${{ steps.run.outputs.CONNECT_SERVER }}
  CONTAINER_ID:
    description: 'Docker container ID (only set when no command is provided)'
    value: ${{ steps.run.outputs.CONTAINER_ID }}

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v7

    - name: Install with-connect
      shell: bash
      run: uv tool install ${{ github.action_path }}

    - name: Create license file
      shell: bash
      run: echo "${{ inputs.license }}" > rstudio-connect.lic

    - name: Run command
      id: run
      shell: bash
      run: |
        # Handle stop mode
        if [ -n "${{ inputs.stop }}" ]; then
          with-connect --stop "${{ inputs.stop }}"
          exit 0
        fi

        # Build arguments
        ARGS="--version ${{ inputs.version }} --port ${{ inputs.port }}"
        if [ -n "${{ inputs.config-file }}" ]; then
          ARGS="$ARGS --config ${{ inputs.config-file }}"
        fi
        if [ -n "${{ inputs.image }}" ]; then
          ARGS="$ARGS --image ${{ inputs.image }}"
        fi
        if [ "${{ inputs.quiet }}" = "true" ]; then
          ARGS="$ARGS --quiet"
        fi
        if [ -n "${{ inputs.env }}" ]; then
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              ARGS="$ARGS -e $line"
            fi
          done <<< "${{ inputs.env }}"
        fi

        # Check if command is provided
        if [ -z "${{ inputs.command }}" ]; then
          # Start-only mode: output is already in KEY=value format
          with-connect $ARGS >> $GITHUB_OUTPUT
        else
          # Run with command
          with-connect $ARGS -- bash <<'SCRIPT'
        ${{ inputs.command }}
        SCRIPT
        fi
