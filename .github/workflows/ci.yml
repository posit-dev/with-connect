name: Test Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run unit tests
        run: uv run test_main.py

  # Command mode on the modern ghcr.io/posit-dev/connect image (default version),
  # across x86 and arm runners.
  test-action:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Test with-connect action (single line)
        uses: ./
        with:
          license: ${{ secrets.CONNECT_LICENSE }}
          # If this were not quoted before running, $CONNECT_API_KEY
          # would evaluate before with-connect defines it.
          command: 'curl -f -H "Authorization: Key $CONNECT_API_KEY" $CONNECT_SERVER/__api__/v1/content'

      - name: Test with-connect action (multiline, different quoting)
        uses: ./
        with:
          license: ${{ secrets.CONNECT_LICENSE }}
          command: |
            set -euo pipefail
            echo "Testing multiline command with various quote types"
            RESPONSE=$(curl -f -H "Authorization: Key $CONNECT_API_KEY" $CONNECT_SERVER/__api__/v1/content)
            # The response should be an empty JSON array since no content has been deployed
            echo "Response: $RESPONSE"
            [ "$RESPONSE" = "[]" ] || exit 1
            # Test that single quotes work in commands
            TEST_STRING='This contains single quotes'
            echo "TEST_STRING value: $TEST_STRING"
            [ "$TEST_STRING" = "This contains single quotes" ] || exit 1
            echo "✓ Multiline test passed - variables, single quotes, and double quotes all work"

  # Legacy image (rstudio/rstudio-connect) start-only + graceful stop.
  test-action-start-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Start Connect (no command)
        id: start-connect
        uses: ./
        with:
          version: 2024.08.0  # legacy rstudio/rstudio-connect image
          license: ${{ secrets.CONNECT_LICENSE }}

      - name: Verify outputs are set
        run: |
          set -euo pipefail
          echo "API Key length: ${#CONNECT_API_KEY}"
          echo "Server: $CONNECT_SERVER"
          echo "Container ID: $CONTAINER_ID"
          [ -n "$CONNECT_API_KEY" ] || { echo "ERROR: CONNECT_API_KEY output is empty"; exit 1; }
          [ -n "$CONNECT_SERVER" ] || { echo "ERROR: CONNECT_SERVER output is empty"; exit 1; }
          [ -n "$CONTAINER_ID" ] || { echo "ERROR: CONTAINER_ID output is empty"; exit 1; }
          echo "✓ All outputs are set"
        env:
          CONNECT_API_KEY: ${{ steps.start-connect.outputs.CONNECT_API_KEY }}
          CONNECT_SERVER: ${{ steps.start-connect.outputs.CONNECT_SERVER }}
          CONTAINER_ID: ${{ steps.start-connect.outputs.CONTAINER_ID }}

      - name: Use Connect with outputs
        run: |
          set -euo pipefail
          RESPONSE=$(curl -f -H "Authorization: Key $CONNECT_API_KEY" "$CONNECT_SERVER/__api__/v1/content")
          echo "Response: $RESPONSE"
          [ "$RESPONSE" = "[]" ] || exit 1
          echo "✓ Successfully used Connect with action outputs"
        env:
          CONNECT_API_KEY: ${{ steps.start-connect.outputs.CONNECT_API_KEY }}
          CONNECT_SERVER: ${{ steps.start-connect.outputs.CONNECT_SERVER }}

      - name: Stop Connect
        uses: ./
        with:
          stop: ${{ steps.start-connect.outputs.CONTAINER_ID }}

      - name: Verify container stopped
        run: |
          set -euo pipefail
          if docker ps -q --filter "id=$CONTAINER_ID" | grep -q .; then
            echo "ERROR: Container is still running"
            exit 1
          fi
          echo "✓ Container successfully stopped"
        env:
          CONTAINER_ID: ${{ steps.start-connect.outputs.CONTAINER_ID }}

  # Full --reset cycle (dirty -> reset -> pristine + same key).
  test-action-reset:
    name: test-action-reset (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "release"     # modern ghcr.io/posit-dev/connect image
            label: modern
          - version: "2024.08.0"   # legacy rstudio/rstudio-connect image
            label: legacy
          - version: "2022.10.0"   # README's documented minimum (bionic image)
            label: legacy-minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Start Connect (start-only)
        id: start
        uses: ./
        with:
          version: ${{ matrix.version }}
          license: ${{ secrets.CONNECT_LICENSE }}

      - name: Deploy content to dirty the instance
        run: |
          set -euo pipefail
          curl -f -s -X POST "$CONNECT_SERVER/__api__/v1/content" \
            -H "Authorization: Key $CONNECT_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"name":"ci-reset-test","title":"CI Reset Test"}' > /dev/null
          COUNT=$(curl -f -s -H "Authorization: Key $CONNECT_API_KEY" "$CONNECT_SERVER/__api__/v1/content" \
            | python3 -c 'import sys, json; print(len(json.load(sys.stdin)))')
          echo "Content count after deploy: $COUNT"
          [ "$COUNT" = "1" ] || { echo "ERROR: expected 1 content item"; exit 1; }
          echo "✓ Instance dirtied with one content item"
        env:
          CONNECT_API_KEY: ${{ steps.start.outputs.CONNECT_API_KEY }}
          CONNECT_SERVER: ${{ steps.start.outputs.CONNECT_SERVER }}

      - name: Reset Connect
        uses: ./
        with:
          reset: ${{ steps.start.outputs.CONTAINER_ID }}

      - name: Verify pristine state with the same API key
        run: |
          set -euo pipefail
          RESPONSE=$(curl -f -H "Authorization: Key $CONNECT_API_KEY" "$CONNECT_SERVER/__api__/v1/content")
          echo "Content after reset: $RESPONSE"
          [ "$RESPONSE" = "[]" ] || { echo "ERROR: content should be wiped after reset"; exit 1; }
          if ! docker ps -q --filter "id=$CONTAINER_ID" | grep -q .; then
            echo "ERROR: container should still be running after reset"
            exit 1
          fi
          echo "✓ Reset produced a clean Connect, kept the same API key, and left the container running"
        env:
          CONNECT_API_KEY: ${{ steps.start.outputs.CONNECT_API_KEY }}
          CONNECT_SERVER: ${{ steps.start.outputs.CONNECT_SERVER }}
          CONTAINER_ID: ${{ steps.start.outputs.CONTAINER_ID }}

      - name: Stop Connect
        uses: ./
        with:
          stop: ${{ steps.start.outputs.CONTAINER_ID }}

  # --reset must refuse (not silently no-op) when Connect points at an external
  # database, against a live Postgres-backed Connect rather than a mock.
  test-reset-external-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Create license file
        run: echo "${{ secrets.CONNECT_LICENSE }}" > rstudio-connect.lic

      - name: Run external-database reset test
        run: |
          CONNECT_LICENSE_FILE=rstudio-connect.lic \
            uv run --with pytest pytest test_integration.py -k test_reset_refuses_external_database -v

  # --reset must work against a custom Server.DataDir path that doesn't already
  # exist in the image (Connect logs "Creating", not "Using", the first time).
  test-reset-custom-datadir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Create license file
        run: echo "${{ secrets.CONNECT_LICENSE }}" > rstudio-connect.lic

      - name: Run custom-DataDir reset test
        run: |
          CONNECT_LICENSE_FILE=rstudio-connect.lic \
            uv run --with pytest pytest test_integration.py -k test_reset_works_with_custom_datadir -v

  # CLI command mode on the legacy rstudio/rstudio-connect image.
  test-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Create license file
        run: echo "${{ secrets.CONNECT_LICENSE }}" > rstudio-connect.lic

      - name: Install with-connect
        run: uv tool install .

      - name: Test with-connect CLI
        run: |
          with-connect --version 2024.08.0 -- \
            bash -c '
              set -euo pipefail
              RESPONSE=$(curl -f -H "Authorization: Key $CONNECT_API_KEY" $CONNECT_SERVER/__api__/v1/content)
              # The response should be an empty JSON array since no content has been deployed
              echo "Response: $RESPONSE"
              [ "$RESPONSE" = "[]" ] || exit 1
              echo "✓ CLI test passed - got valid JSON response"
            '
