name: Test Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run unit tests
        run: uv run test_main.py

  test-action:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Test with-connect action (single line)
        uses: ./
        with:
          license: ${{ secrets.CONNECT_LICENSE }}
          # If this were not quoted before running, $CONNECT_API_KEY
          # would evaluate before with-connect defines it.
          command: 'curl -f -H "Authorization: Key $CONNECT_API_KEY" $CONNECT_SERVER/__api__/v1/content'

      - name: Test with-connect action (multiline, different quoting)
        uses: ./
        with:
          license: ${{ secrets.CONNECT_LICENSE }}
          command: |
            set -euo pipefail
            echo "Testing multiline command with various quote types"
            RESPONSE=$(curl -f -H "Authorization: Key $CONNECT_API_KEY" $CONNECT_SERVER/__api__/v1/content)
            # The response should be an empty JSON array since no content has been deployed
            echo "Response: $RESPONSE"
            [ "$RESPONSE" = "[]" ] || exit 1
            # Test that single quotes work in commands
            TEST_STRING='This contains single quotes'
            echo "TEST_STRING value: $TEST_STRING"
            [ "$TEST_STRING" = "This contains single quotes" ] || exit 1
            echo "✓ Multiline test passed - variables, single quotes, and double quotes all work"

  test-action-start-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Start Connect (no command)
        id: start-connect
        uses: ./
        with:
          version: 2024.08.0
          license: ${{ secrets.CONNECT_LICENSE }}

      - name: Verify outputs are set
        run: |
          set -euo pipefail
          echo "API Key length: ${#CONNECT_API_KEY}"
          echo "Server: $CONNECT_SERVER"
          echo "Container ID: $CONTAINER_ID"
          [ -n "$CONNECT_API_KEY" ] || { echo "ERROR: CONNECT_API_KEY output is empty"; exit 1; }
          [ -n "$CONNECT_SERVER" ] || { echo "ERROR: CONNECT_SERVER output is empty"; exit 1; }
          [ -n "$CONTAINER_ID" ] || { echo "ERROR: CONTAINER_ID output is empty"; exit 1; }
          echo "✓ All outputs are set"
        env:
          CONNECT_API_KEY: ${{ steps.start-connect.outputs.CONNECT_API_KEY }}
          CONNECT_SERVER: ${{ steps.start-connect.outputs.CONNECT_SERVER }}
          CONTAINER_ID: ${{ steps.start-connect.outputs.CONTAINER_ID }}

      - name: Use Connect with outputs
        run: |
          set -euo pipefail
          RESPONSE=$(curl -f -H "Authorization: Key $CONNECT_API_KEY" "$CONNECT_SERVER/__api__/v1/content")
          echo "Response: $RESPONSE"
          [ "$RESPONSE" = "[]" ] || exit 1
          echo "✓ Successfully used Connect with action outputs"
        env:
          CONNECT_API_KEY: ${{ steps.start-connect.outputs.CONNECT_API_KEY }}
          CONNECT_SERVER: ${{ steps.start-connect.outputs.CONNECT_SERVER }}

      - name: Stop Connect
        uses: ./
        with:
          stop: ${{ steps.start-connect.outputs.CONTAINER_ID }}

      - name: Verify container stopped
        run: |
          set -euo pipefail
          if docker ps -q --filter "id=$CONTAINER_ID" | grep -q .; then
            echo "ERROR: Container is still running"
            exit 1
          fi
          echo "✓ Container successfully stopped"
        env:
          CONTAINER_ID: ${{ steps.start-connect.outputs.CONTAINER_ID }}

  test-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Create license file
        run: echo "${{ secrets.CONNECT_LICENSE }}" > rstudio-connect.lic

      - name: Install with-connect
        run: uv tool install .

      - name: Test with-connect CLI
        run: |
          with-connect --version 2024.08.0 -- \
            bash -c '
              set -euo pipefail
              RESPONSE=$(curl -f -H "Authorization: Key $CONNECT_API_KEY" $CONNECT_SERVER/__api__/v1/content)
              # The response should be an empty JSON array since no content has been deployed
              echo "Response: $RESPONSE"
              [ "$RESPONSE" = "[]" ] || exit 1
              echo "✓ CLI test passed - got valid JSON response"
            '
